name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'drill-index.yaml'
      - 'aws/**'
      - 'kubernetes/**'
      - 'gitlab/**'
      - 'scripts/build-site.py'
      - 'docs/**'
      # build-site.py also reads these, so a change here alters the built
      # artifact. Without them the deploy never fires, the site keeps serving
      # the previous build, and nothing reports it.
      - 'css/**'
      - 'js/**'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'og-preview.jpg'
      - 'favicon.svg'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'site.webmanifest'
      - 'web-app-manifest-192x192.png'
      - 'web-app-manifest-512x512.png'
      - 'logo.svg'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.4

      - name: Build site data
        run: python3 scripts/build-site.py

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
